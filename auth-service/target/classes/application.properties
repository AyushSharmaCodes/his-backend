# ========================================
# Database Configuration (Oracle)
# ========================================
# Replace the placeholders below with your actual Oracle database connection details

# Oracle Database URL - Format: jdbc:oracle:thin:@hostname:port:SID or jdbc:oracle:thin:@//hostname:port/service_name
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
# Database username
spring.datasource.username=your_db_username
# Database password
spring.datasource.password=your_db_password
# Oracle database driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ========================================
# JPA/Hibernate Configuration
# ========================================
# Hibernate dialect for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Show SQL queries in console (set to false in production)
spring.jpa.show-sql=true
# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true
# Hibernate DDL auto mode (create-drop, create, update, validate, none)
# Use 'update' for development, 'validate' for production
spring.jpa.hibernate.ddl-auto=update

# ========================================
# Application Configuration
# ========================================
# Server port for the auth service
server.port=8081
# Application context path
server.servlet.context-path=/auth-service

# ========================================
# JWT Configuration
# ========================================
# JWT Secret Key - IMPORTANT: Replace this with a strong, unique secret key in production
# The key should be at least 256 bits (32 characters) for HS256 algorithm
app.jwt.secret=mySecretKey123456789012345678901234567890
# JWT token expiration time in milliseconds (24 hours = 86400000 ms)
app.jwt.expiration=86400000
# JWT token prefix for Authorization header
app.jwt.token-prefix=Bearer 

# ========================================
# Logging Configuration
# ========================================
# Set logging level for the application
logging.level.com.his.authservice=DEBUG
# Set logging level for Spring Security (useful for debugging)
logging.level.org.springframework.security=DEBUG
# Set root logging level
logging.level.root=INFO

# ========================================
# Management and Actuator Endpoints
# ========================================
# Enable actuator endpoints for health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized