version: '3.8'

services:
  service-registry:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=service-registry
    ports:
      - "8761:8761"
    networks:
      - his-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
    networks:
      - his-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  his-network:
    driver: bridge