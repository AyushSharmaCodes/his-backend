spring:
  application:
    name: HIS-AUTH-SERVICE
  boot:
    admin:
      client:
        url: http://localhost:1111/

  datasource:
    url: jdbc:postgresql://localhost:5433/his
    username: postgres
    password: master
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 9090
  servlet:
    context-path: /api/auth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: '*'